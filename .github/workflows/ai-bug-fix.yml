name: AI Bug Fixer

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-bug-fix:
    # Only run if the issue is a bug or explicitly labeled for AI fixing
    if: github.event.issue.state == 'open' && (contains(github.event.issue.labels.*.name, 'bug') || contains(github.event.issue.labels.*.name, 'ai-fix'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Configure Git Author
        run: |
          git config --global user.name "gemini-ai-bot[bot]"
          git config --global user.email "gemini-ai-bot[bot]@users.noreply.github.com"

      - name: Run Gemini CLI Bug Fixer
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_issue_number: ${{ github.event.issue.number }}
          prompt: |
            You are an expert Spring Boot software engineer AI assistant.
            A GitHub issue has been opened or labeled for AI fixing (Issue #${{ github.event.issue.number }}).
            
            Please execute the following steps carefully:
            1. Read the GitHub issue details using: gh issue view ${{ github.event.issue.number }}
            2. Inspect the relevant repository files (such as pom.xml, service classes, controllers, and tests).
            3. Identify the root cause of the bug described in the issue.
            4. Implement a clean, minimal fix for the bug in the source code, and add or update unit tests to verify the fix.
            5. Run `./mvnw clean test` to ensure all tests pass successfully.
            6. Create a dedicated branch named `ai-fix/issue-${{ github.event.issue.number }}`.
            7. Commit your changes with a clear commit message.
            8. Open a pull request targeting `main` using `gh pr create --title "AI Fix: Issue #${{ github.event.issue.number }}" --body "Automated fix for issue #${{ github.event.issue.number }} by Gemini CLI."`.
            
            IMPORTANT CONSTRAINTS:
            - Never push directly to main.
            - Never merge pull requests automatically.
            - Never bypass human review.
            - Do not hardcode, display, log, or expose API keys or secrets.


name: AI Bug Fixer

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-bug-fix:
    if: >-
      github.event.issue.state == 'open' &&
      (
        contains(github.event.issue.labels.*.name, 'bug') ||
        contains(github.event.issue.labels.*.name, 'ai-fix')
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure Git Author
        run: |
          git config user.name "gemini-ai-bot[bot]"
          git config user.email \
            "gemini-ai-bot[bot]@users.noreply.github.com"

      - name: Run Gemini CLI Bug Fixer
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.1-flash-lite
          github_issue_number: ${{ github.event.issue.number }}
          prompt: |
            You are a Spring Boot bug-fixing engineer.

            Task: fix GitHub Issue #${{ github.event.issue.number }}
            in the checked-out repository.

            Instructions:
            1. Read the issue using:
               gh issue view ${{ github.event.issue.number }}
            2. Inspect the relevant source files and existing tests.
            3. Identify the root cause before editing.
            4. Implement the smallest correct fix.
            5. Add or update relevant unit tests.
            6. Do not modify unrelated files.
            7. Do not create branches, commits, pushes or pull requests.
               GitHub Actions will handle those steps.
            8. Do not merge anything or change the main branch.
            9. Never reveal secrets or API keys.
            10. Finish by reporting the files changed and the
                reason for the fix.

      - name: Check for Code Changes
        id: changes
        shell: bash
        run: |
          git status --short
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Gemini finished without changing any files."
            exit 1
          fi

      - name: Run Maven Tests
        id: tests
        run: |
          chmod +x ./mvnw
          ./mvnw clean test

      - name: Create Branch and Commit
        id: commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          BRANCH="ai-fix/issue-${ISSUE_NUMBER}"

          git switch -c "$BRANCH"
          git add -u
          git add .
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "::error::No changes to commit."
            exit 1
          fi

          git commit -m "fix: resolve issue #${ISSUE_NUMBER}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Push Branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --set-upstream origin \
            "${{ steps.commit.outputs.branch }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "AI Fix: Issue #${ISSUE_NUMBER}" \
            --body "Automated fix for #${ISSUE_NUMBER} by Gemini CLI.

          - Generated changes reviewed by CI
          - Maven tests passed
          - Human review and merge required"
